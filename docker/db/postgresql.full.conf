# PostgreSQL settings for the full twelve-month window in the local Compose stack
# (P1-08; docs/spec.md §2.2 and §3.4; measured in docs/benchmarks.md).
#
# Select it with PREXP_DB_CONFIG=full in .env (and PREXP_DB_SHM_SIZE=8gb), then
# recreate the database container: docker compose up -d db
# compose.yaml starts the server with -c config_file=/etc/postgresql/postgresql.full.conf.
# This file reads the laptop-sized file first, so the include of initdb's
# configuration, listen_addresses and anything not set here stay as they are there.
#
# Sized for the development machine: Docker Desktop's VM has 16 CPUs and 100 GB
# (.wslconfig), shared with the other containers. Twelve months are about 21 GB of
# tables and indexes (spec §3.4). Phase 2 tunes these against the full data
# (P2-05), and the server's settings are derived from them (P6-02).
include 'postgresql.dev.conf'

# Memory: the hot indexes in shared buffers, the kernel's cache for the rest
shared_buffers = 16GB
effective_cache_size = 48GB
# Per sort or hash in each query; the app's queries are small
work_mem = 64MB
# Index builds and VACUUM of a 9.5-million-row month
maintenance_work_mem = 4GB

# Write-ahead log: a month's table and indexes are a few GB; fewer checkpoints
# while it loads, with compressed full-page images. Staging is unlogged.
max_wal_size = 32GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = lz4

# Solid-state disk
random_page_cost = 1.1

# Parallelism across the 16 CPUs. Parallel queries share memory through
# /dev/shm, which PREXP_DB_SHM_SIZE raises for the container.
max_worker_processes = 16
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

jit = off
