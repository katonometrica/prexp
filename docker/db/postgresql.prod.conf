# PostgreSQL settings for the server (P6-02; docs/spec.md §2.3, §7; docs/server.md),
# sized for its 4 vCPUs and 15 GiB of RAM, which it shares with other projects
# (docs/benchmarks.md, "The server"), from the values postgresql.full.conf uses for
# the twelve-month window on the development machine.
#
# Coolify starts the database with this file as its configuration (the database's
# General > Custom PostgreSQL configuration), which replaces the data directory's
# postgresql.conf. So it first includes the one initdb wrote there, which keeps
# initdb's locale, time zone and text search settings; later lines win. Coolify adds
# listen_addresses = '*' only when the file does not mention it, so it is set here.
# The path contains the major version: update it together with the image. Apply a
# change by restarting the database in Coolify, which shows no badge for it.
include_if_exists '/var/lib/postgresql/18/docker/postgresql.conf'

# The app and the jobs container connect over Coolify's Docker network; the database
# publishes no port
listen_addresses = '*'

# Memory: a fifth of the RAM for shared buffers, which keep the hot indexes, less
# than the usual quarter because other projects share the server; the kernel's
# cache, about half of the RAM, for the rest. The database's memory limit in
# Coolify (6 GB) bounds it all, so a load cannot push the server's other
# containers out of memory: there is no swap.
shared_buffers = 3GB
effective_cache_size = 8GB
# As on the development machine: the app's largest hash (a large practice's top
# drugs over twelve months, 9.5 MB) fits, and the loads' sorts get room
work_mem = 64MB
# Index builds and VACUUM of a month of 9.5 million rows
maintenance_work_mem = 1GB

# Write-ahead log: fewer checkpoints while a month loads, with compressed full-page
# images. Staging is unlogged.
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = lz4

# Solid-state disk
random_page_cost = 1.1

# Parallelism across the 4 vCPUs, for the loads. Parallel queries share memory
# through /dev/shm, which the database's Custom Docker options raise (--shm-size).
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# No app query costs enough to trigger JIT; the app role has jit = off as well
jit = off
