# PostgreSQL settings for the local Compose stack (docs/spec.md §2.2).
#
# compose.yaml starts the server with
#   postgres -c config_file=/etc/postgresql/postgresql.dev.conf
# A config_file replaces the data directory's postgresql.conf entirely, so this file
# first includes the one initdb wrote into the pgdata volume. That keeps the image's
# listen_addresses = '*' and initdb's locale, time zone and text search settings.
# pg_hba.conf still comes from the data directory, with the image's
# "host all all all scram-sha-256" line. ALTER SYSTEM still works: postgresql.auto.conf
# in the data directory is read last. Later lines win.
# The path contains the major version: update it together with the image.
# Apply changes with: docker compose restart db
include '/var/lib/postgresql/18/docker/postgresql.conf'

# The rstudio and app containers connect over the Compose network
listen_addresses = '*'

# Laptop-sized values. The full twelve months use postgresql.full.conf (P1-08), and
# the server postgresql.prod.conf (P6-02).
# Parallel queries use /dev/shm, which compose.yaml raises to 1 GB (shm_size).
shared_buffers = 1GB
work_mem = 64MB
maintenance_work_mem = 1GB
max_wal_size = 8GB
jit = off
