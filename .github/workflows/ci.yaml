# Continuous integration for prexp (spec section 6.2).
#
# image        Builds and pushes ghcr.io/<owner>/prexp-ci:<hash>-<month> only when no image
#              exists for the current docker/Dockerfile, renv.lock and month; otherwise
#              every run reuses the stored image. The month refreshes the OS layer
#              (apt-get upgrade) monthly.
# checks       Runs in that image with a PostgreSQL 18 service: lint, migrate, then tests
#              with coverage.
# test         The required check on main: a gate that passes only if "checks" passed.
#              Keep this job id, give it no name, and make sure it can only pass by passing.
# app-image    Pull requests: builds the app image on the tested image's layers and checks
#              that it loads, with a read-only token.
# app-publish  main (push, monthly schedule, manual run): the same build, then pushes
#              :<sha>, and :main only while the commit is still main's tip.
#
# Third-party actions are pinned to commit SHAs, and the BuildKit image to a digest,
# because the image jobs hold a token that can push packages; Dependabot proposes action
# updates (.github/dependabot.yml). Update the BuildKit pin by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The 1st of each month: rebuild the images for the new month, so they get Ubuntu
    # security fixes
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      os-refresh: ${{ steps.ref.outputs.os-refresh }}
      ubuntu-mirror: ${{ steps.ref.outputs.ubuntu-mirror }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's own Ubuntu mirror is passed to the build, because archive.ubuntu.com
      # can be very slow from GitHub's runners. All image builds must pass the same
      # build arguments, or they cannot reuse each other's layers.
      - name: Name the CI image after its inputs and the month
        id: ref
        env:
          # Every file that the base or ci stage copies belongs in this hash.
          INPUTS_HASH: ${{ hashFiles('docker/Dockerfile', 'renv.lock') }}
        run: |
          : "${INPUTS_HASH:?docker/Dockerfile and renv.lock were not found}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          month="$(date -u +%Y-%m)"
          tag="${INPUTS_HASH:0:16}-${month}"
          # The runner lists its mirrors in a file (URIs: mirror+file:/etc/apt/...): take
          # the first plain http(s) mirror from it. Anything else means default mirrors.
          uri="$(awk '/^URIs:/ {print $2; exit}' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true)"
          case "$uri" in
            mirror+file:*) mirror="$(grep -m1 -oE 'https?://[^[:space:]]+' "${uri#mirror+file:}" 2>/dev/null || true)" ;;
            *) mirror="$uri" ;;
          esac
          [[ "$mirror" =~ ^https?://[A-Za-z0-9.-]+(/[A-Za-z0-9._/-]*)?$ ]] || mirror=""
          {
            echo "image=ghcr.io/${owner}/prexp-ci:${tag}"
            echo "cache=ghcr.io/${owner}/prexp-ci:buildcache"
            echo "os-refresh=${month}"
            echo "ubuntu-mirror=${mirror}"
          } >> "$GITHUB_OUTPUT"
          echo "CI image: ghcr.io/${owner}/prexp-ci:${tag} (Ubuntu mirror: ${mirror:-default})" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only a "does not exist" answer counts as missing. Any other registry error
      # (rate limit, outage) fails the step instead of rebuilding and overwriting the tag.
      # GHCR answers "denied" for a package that does not exist yet.
      - name: Check whether the image exists
        id: check
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          if err=$(docker buildx imagetools inspect "$IMAGE" 2>&1 > /dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reused the existing image." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qiE 'not found|manifest unknown|name unknown|denied' <<< "$err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check $IMAGE: $err"
            exit 1
          fi

      - name: Stop if a pull request from a fork needs a new image
        if: >-
          steps.check.outputs.exists != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::This pull request needs a new CI image (a new docker/Dockerfile, renv.lock or month), and pull requests from forks cannot push images. A maintainer can push the branch to this repository and open the pull request from there."
          exit 1

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      # Caches: the image itself carries its cache metadata (inline), so the app builds
      # reuse exactly the tested layers with nothing extra stored; and one shared cache,
      # overwritten by each build, lets a build for a new renv.lock reuse the OS layer.
      - name: Build and push the CI image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          push: true
          tags: ${{ steps.ref.outputs.image }}
          build-args: |
            OS_REFRESH=${{ steps.ref.outputs.os-refresh }}
            UBUNTU_MIRROR=${{ steps.ref.outputs.ubuntu-mirror }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=prexp CI image: R, system libraries and the locked R packages
          cache-from: type=registry,ref=${{ steps.ref.outputs.cache }}
          cache-to: |
            type=inline
            type=registry,ref=${{ steps.ref.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true

  checks:
    needs: image
    # Runs when the image job fails (and then fails); Cancel and cancel-in-progress stop
    # it. The required check is the gate job "test" below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        # Keep this reference identical to the db service in compose.yaml.
        image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: prexp_owner
          POSTGRES_PASSWORD: ci-owner-not-secret
          POSTGRES_DB: prexp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U prexp_owner -d prexp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PREXP_DB_HOST: postgres
      PREXP_DB_PORT: "5432"
      PREXP_DB_NAME: prexp
      PREXP_TEST_DB_NAME: prexp_test
      PREXP_TEST_DB_REQUIRED: "true"
      # Without it testthat assumes a CRAN check and silently skips snapshot tests, such as
      # the one guarding the applied migrations' checksums
      NOT_CRAN: "true"
      # Throwaway passwords for the throwaway service database
      PREXP_OWNER_PASSWORD: ci-owner-not-secret
      PREXP_LOADER_PASSWORD: ci-loader-not-secret
      PREXP_APP_PASSWORD: ci-app-not-secret
      # Use the packages in the image's site library, never a renv project library.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - name: Stop if there is no CI image
        if: needs.image.result != 'success'
        env:
          RESULT: ${{ needs.image.result }}
        run: |
          echo "::error::The image job ended with '${RESULT}', so there is no image to test in."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the roles and the test database, as Compose does
        env:
          PGHOST: postgres
          PGPORT: "5432"
          PGUSER: prexp_owner
          PGDATABASE: prexp
          PGPASSWORD: ci-owner-not-secret
        run: |
          bash docker/db/init/01-roles.sh
          psql -v ON_ERROR_STOP=1 --no-psqlrc -f docker/db/init/02-database.sql

      # Before lint: lintr looks names up in the installed prexp namespace.
      - name: Install prexp
        run: R CMD INSTALL --no-docs .

      - name: Lint
        run: |
          Rscript -e 'lints <- lintr::lint_package(); print(lints); if (length(lints) > 0L) quit(save = "no", status = 1L)'

      - name: Migrate the empty databases
        run: |
          Rscript -e 'prexp::migrate()'
          PREXP_DB_NAME="$PREXP_TEST_DB_NAME" Rscript -e 'prexp::migrate()'

      # Two gates: 85% overall, and no package function without coverage, so deleting
      # any test that is a function's only coverage fails CI.
      - name: Test with coverage
        run: |
          Rscript -e '
            cov <- covr::package_coverage(type = "tests", quiet = FALSE)
            print(cov)
            dir.create("coverage", showWarnings = FALSE)
            covr::report(cov, file = "coverage/coverage.html", browse = FALSE)
            pct <- covr::percent_coverage(cov)
            df <- as.data.frame(cov)
            hit <- tapply(df$value > 0, paste0(df$filename, ":", df$functions), any)
            cat(sprintf("Coverage: %.1f%% (gate 85%%); %d of %d functions covered\n",
                        pct, sum(hit), length(hit)),
                file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
            if (pct < 85) stop(sprintf("Coverage %.1f%% is below the 85%% gate.", pct), call. = FALSE)
            if (!all(hit)) stop("Functions with no test coverage: ", toString(names(hit)[!hit]), call. = FALSE)
          '

      # covr::report() writes coverage.html plus a lib/ folder of scripts and styles.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  # The required check. It always runs, so a failed, skipped or cancelled "checks" job
  # fails it (GitHub counts a skipped required check as passed), while Cancel still stops
  # the checks themselves. Keep this job id and give it no name.
  test:
    needs: [image, checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pass only if the checks passed
        env:
          IMAGE_RESULT: ${{ needs.image.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "image: ${IMAGE_RESULT}, checks: ${CHECKS_RESULT}"
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "::error::The checks ended with '${CHECKS_RESULT}'."
            exit 1
          fi

  # Pull requests, including Dependabot's: a read-only token. Writes happen in app-publish.
  app-image:
    if: ${{ github.event_name == 'pull_request' }}
    needs: [image, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the app image
        id: ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/prexp-app" >> "$GITHUB_OUTPUT"
          echo "app-cache=ghcr.io/${owner}/prexp-app:buildcache" >> "$GITHUB_OUTPUT"

      # Before the build: the registry caches are private packages.
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      # The base layers come from the tested CI image itself (its inline cache), so the
      # app runs on the packages the tests ran on.
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: app
          load: true
          tags: ${{ steps.ref.outputs.image }}:${{ github.sha }}
          build-args: |
            OS_REFRESH=${{ needs.image.outputs.os-refresh }}
            UBUNTU_MIRROR=${{ needs.image.outputs.ubuntu-mirror }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Prescription Explorer app image
          cache-from: |
            type=registry,ref=${{ needs.image.outputs.image }}
            type=registry,ref=${{ steps.ref.outputs.app-cache }}

      - name: Check that prexp loads in the app image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}:${{ github.sha }}
        run: docker run --rm "$IMAGE" Rscript -e 'library(prexp); cat(prexp_version(), "\n")'

  # main only: push, the monthly schedule, or a manual run on main.
  app-publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [image, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the app image
        id: ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/prexp-app" >> "$GITHUB_OUTPUT"
          echo "app-cache=ghcr.io/${owner}/prexp-app:buildcache" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: app
          load: true
          tags: |
            ${{ steps.ref.outputs.image }}:main
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
          build-args: |
            OS_REFRESH=${{ needs.image.outputs.os-refresh }}
            UBUNTU_MIRROR=${{ needs.image.outputs.ubuntu-mirror }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Prescription Explorer app image
          cache-from: |
            type=registry,ref=${{ needs.image.outputs.image }}
            type=registry,ref=${{ steps.ref.outputs.app-cache }}
          cache-to: type=registry,ref=${{ steps.ref.outputs.app-cache }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Check that prexp loads in the app image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}:${{ github.sha }}
        run: docker run --rm "$IMAGE" Rscript -e 'library(prexp); cat(prexp_version(), "\n")'

      # A re-run of an older main run uses that run's commit, so :main moves only while
      # the commit is still main's tip. Runs on main are serialised by the concurrency
      # group, so this check cannot race a newer run.
      - name: Push the commit tag, and :main if the commit is still main's tip
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            docker push "$IMAGE:main"
          else
            echo "::warning::$GITHUB_SHA is no longer main's tip ($tip), so :main was not moved."
          fi
